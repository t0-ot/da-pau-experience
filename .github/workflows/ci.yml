
name: Build, Test & Deploy Docs

on:
  push:
    branches: [ main ]

  pull_request:

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string
        default: 'v0.1.0'

      publish_release:
        description: 'Publish a GitHub Release after successful builds'
        required: true
        type: boolean
        default: false

      prerelease:
        description: 'Mark the release as a prerelease'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Linux Compile + ASan Memory/Crash Smoke Test
  linux-build-and-test:
    name: Linux Build & ASan Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo & Raylib submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux X11/OpenGL & Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev xvfb

      - name: Cache compiled Raylib (Linux)
        uses: actions/cache@v5
        with:
          path: external/raylib/src/libraylib.a
          key: raylib-linux-${{ hashFiles('external/raylib/src/raylib.h') }}

      - name: Compile Release
        run: make release

      - name: Package Linux Release
        run: |
          APP_DIR="dist/linux/Da-Pau-Launching-Experience"
          mkdir -p "$APP_DIR"
          cp bin/Release/Da-Pau-Launching-Experience "$APP_DIR/"
          cp -a assets "$APP_DIR/"

      - name: Upload Linux Playable Build
        uses: actions/upload-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Linux
          path: dist/linux

      - name: Rebuild Raylib & Compile ASan Debug
        run: |
          make -C external/raylib/src clean
          make asan

      - name: Configure Virtual Audio Output
        run: |
          cat > "$HOME/.asoundrc" <<'EOF'
          pcm.!default {
              type null
          }
          EOF

      - name: Run Headless Startup Smoke Test (ASan)
        run: |
          timeout --preserve-status 3s xvfb-run -a ./bin/Debug-Asan/Da-Pau-Launching-Experience || [ $? -eq 143 ] || [ $? -eq 124 ]

  # 2. Build Linux AppImage
  linux-appimage:
    name: Build Linux AppImage
    needs: linux-build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Linux Build
        uses: actions/download-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Linux
          path: dist/linux

      - name: Install AppImage Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      - name: Prepare AppDir
        run: |
          APP_DIR="AppDir"
          BIN_DIR="$APP_DIR/usr/bin"
          ICON_DIR="$APP_DIR/usr/share/icons/hicolor/256x256/apps"

          mkdir -p "$BIN_DIR"
          mkdir -p "$APP_DIR/usr/share/applications"
          mkdir -p "$ICON_DIR"

          # Copy executable with explicit executable permissions.
          install -m 755 \
            dist/linux/Da-Pau-Launching-Experience/Da-Pau-Launching-Experience \
            "$BIN_DIR/Da-Pau-Launching-Experience"

          # Preserve the complete assets directory.
          cp -a dist/linux/Da-Pau-Launching-Experience/assets "$BIN_DIR/"

          # Install desktop integration metadata.
          cp installer/linux/DaPau.desktop \
            "$APP_DIR/usr/share/applications/DaPau.desktop"

          # Generate icon in the standard hicolor directory.
          convert installer/linux/DaPau.svg \
            -resize 256x256 \
            "$ICON_DIR/DaPau.png"

          # Copy AppImage launcher.
          cp installer/linux/AppRun "$APP_DIR/"
          chmod +x "$APP_DIR/AppRun"

          # Verify executable permissions.
          echo "Checking game executable permissions:"
          ls -l "$BIN_DIR/Da-Pau-Launching-Experience"

          test -x "$BIN_DIR/Da-Pau-Launching-Experience" || {
            echo "ERROR: Game executable is not executable!"
            exit 1
          }

          echo "Checking AppRun permissions:"
          ls -l "$APP_DIR/AppRun"

          test -x "$APP_DIR/AppRun" || {
            echo "ERROR: AppRun is not executable!"
            exit 1
          }

          # Verify desktop file and icon.
          test -f "$APP_DIR/usr/share/applications/DaPau.desktop"
          test -f "$ICON_DIR/DaPau.png"

          echo "Checking generated icon:"
          file "$ICON_DIR/DaPau.png"


      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        run: |
          mkdir -p release

          export APPIMAGE_EXTRACT_AND_RUN=1
          export LDAI_OUTPUT="$GITHUB_WORKSPACE/release/Da-Pau-Launching-Experience.AppImage"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/DaPau.desktop \
            --output appimage

          # Verify the executable inside the finished AppImage.
          echo "Verifying generated AppImage..."

          VERIFY_DIR="$(mktemp -d)"

          (
            cd "$VERIFY_DIR"

            "$GITHUB_WORKSPACE/release/Da-Pau-Launching-Experience.AppImage" \
              --appimage-extract

            echo "Checking executable inside AppImage:"
            ls -l squashfs-root/usr/bin/Da-Pau-Launching-Experience

            test -x squashfs-root/usr/bin/Da-Pau-Launching-Experience || {
              echo "ERROR: Executable permissions were lost during AppImage packaging!"
              exit 1
            }

            echo "Checking packaged icon:"
            test -f squashfs-root/DaPau.png || {
              echo "ERROR: Root icon is missing!"
              exit 1
            }

            echo "Checking packaged desktop file:"
            test -f squashfs-root/usr/share/applications/DaPau.desktop || {
              echo "ERROR: Desktop file is missing!"
              exit 1
            }
          )

          echo "AppImage verification successful!"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Linux-AppImage
          path: release/Da-Pau-Launching-Experience.AppImage
          if-no-files-found: error

  # 3. Windows Cross-Platform Build & Playable .zip
  windows-build:
    name: Windows Build (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repo & Raylib submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Cache compiled Raylib (Windows)
        uses: actions/cache@v5
        with:
          path: external/raylib/src/libraylib.a
          key: raylib-windows-${{ hashFiles('external/raylib/src/raylib.h') }}

      - name: Compile Windows Debug & Release
        run: |
          make debug
          make -C external/raylib/src clean
          make release

      - name: Package Windows Release
        run: |
          APP_DIR="dist/windows/Da-Pau-Launching-Experience"
          mkdir -p "$APP_DIR"
          cp bin/Release/Da-Pau-Launching-Experience.exe "$APP_DIR/"
          cp -a assets "$APP_DIR/"

      - name: Upload Windows Playable Build
        uses: actions/upload-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Windows
          path: dist/windows

  # 4. Build Windows Installer
  windows-installer:
    name: Build Windows Installer
    needs: windows-build
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Windows Build
        uses: actions/download-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Windows
          path: dist/windows

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows Installer
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''

          if ($version -notmatch '^\d+(\.\d+){1,3}(-[0-9A-Za-z.-]+)?$') {
              throw "Invalid release version: $env:RELEASE_TAG"
          }

          New-Item -ItemType Directory -Force -Path "dist/installer/windows" | Out-Null

          Set-Location "installer/windows"

          iscc "/DMyAppVersion=$version" "DaPauInstaller.iss"

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Windows-Installer
          path: dist/installer/windows/Da-Pau-Launching-Experience-Setup.exe
          if-no-files-found: error

  # 5. Generate Portable Release Archives
  package-portable-builds:
    name: Generate Portable Packages
    needs:
      - linux-build-and-test
      - windows-build
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux Build
        uses: actions/download-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Linux
          path: dist/linux

      - name: Download Windows Build
        uses: actions/download-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Windows
          path: dist/windows

      - name: Install ZIP Utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Create Portable Archives
        run: |
          mkdir -p release

          # Linux TAR.GZ
          tar -czf release/Da-Pau-Launching-Experience-Linux.tar.gz \
            -C dist/linux Da-Pau-Launching-Experience

          # Windows ZIP
          cd dist/windows
          zip -r ../../release/Da-Pau-Launching-Experience-Windows.zip \
            Da-Pau-Launching-Experience

      - name: Upload Portable Packages
        uses: actions/upload-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Portable-Packages
          path: release/
          if-no-files-found: error

  # 6. C Static Analysis (Cppcheck + Clang-Tidy)
  static-analysis:
    name: C Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo & Raylib submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install analysis tools & headers
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy bear libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev

      - name: Cache compiled Raylib (Linux)
        uses: actions/cache@v5
        with:
          path: external/raylib/src/libraylib.a
          key: raylib-linux-${{ hashFiles('external/raylib/src/raylib.h') }}

      - name: Scan src/ and include/ with Cppcheck
        run: cppcheck --enable=all --std=c17 --check-level=exhaustive --inline-suppr --suppress=missingIncludeSystem --suppress=constParameterCallback --suppress=*:*external/raylib/* --error-exitcode=1 -I include -I external/raylib/src src/

      - name: Generate compile_commands.json & Run Clang-Tidy
        run: |
          bear -- make release
          find src -name '*.c' -print0 | xargs -0 clang-tidy -p . \
            --checks='-*,bugprone-*,clang-analyzer-*,performance-*,-bugprone-easily-swappable-parameters' \
            --header-filter='^.*(src|include)/.*$'

  # 7. Build Doxygen Docs
  build-docs:
    name: Generate Doxygen Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install Doxygen & Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Run Doxygen
        run: doxygen docs/Doxyfile

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/html

  # 8. Auto-Publish Docs to GitHub Pages (only on main/master push)
  deploy-docs:
    name: Deploy Docs to GitHub Pages
    needs: build-docs
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

