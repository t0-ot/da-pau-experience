name: Build, Test & Deploy Docs

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Linux Compile + ASan Memory/Crash Smoke Test
  linux-build-and-test:
    name: Linux Build & ASan Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo & Raylib submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux X11/OpenGL & Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev xvfb

      - name: Cache compiled Raylib (Linux Release)
        uses: actions/cache@v5
        with:
          path: external/raylib/src/
          key: raylib-linux-release-${{ hashFiles('external/raylib/src/raylib.h', 'external/raylib/src/Makefile') }}

      - name: Compile Linux Release
        run: make release

      - name: Clean Raylib before ASan build
        run: make -C external/raylib/src clean

      - name: Compile Linux ASan Debug
        run: make asan

      - name: Run Headless Startup Smoke Test (ASan)
        run: |
          timeout --preserve-status 3s xvfb-run -a ./bin/Debug-Asan/Da-Pau-Launching-Experience || [ $? -eq 124 ] || [ $? -eq 143 ]

      - name: Package Linux Release
        run: |
          mkdir -p dist/linux
          cp bin/Release/Da-Pau-Launching-Experience dist/linux/
          cp -r src/assets dist/linux/ 2>/dev/null || true

      - name: Upload Linux Playable Build
        uses: actions/upload-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Linux
          path: dist/linux

  # 2. Windows Build & Playable .zip
  windows-build:
    name: Windows Build (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repo & Raylib submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Cache compiled Raylib (Windows)
        uses: actions/cache@v5
        with:
          path: external/raylib/src/
          key: raylib-windows-ucrt64-${{ hashFiles('external/raylib/src/raylib.h', 'external/raylib/src/Makefile') }}

      - name: Compile Windows Debug & Release
        run: |
          make debug
          make -C external/raylib/src clean
          make release

      - name: Package Windows Release
        run: |
          mkdir -p dist/windows
          cp bin/Release/Da-Pau-Launching-Experience.exe dist/windows/
          cp -r src/assets dist/windows/ 2>/dev/null || true

      - name: Upload Windows Playable Build
        uses: actions/upload-artifact@v7
        with:
          name: Da-Pau-Launching-Experience-Windows
          path: dist/windows

  # 3. C Static Analysis (Bug & Memory Scanner)
  static-analysis:
    name: Cppcheck Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo & Raylib submodule
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Scan src/ and include/ for C bugs
        run: cppcheck --enable=all --std=c17 --check-level=exhaustive --inline-suppr --suppress=missingIncludeSystem --suppress=constParameterCallback --suppress=*:*external/raylib/* --error-exitcode=1 -I include -I external/raylib/src src/

  # 4. Build Doxygen Docs
  build-docs:
    name: Generate Doxygen Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install Doxygen & Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Run Doxygen
        run: doxygen docs/Doxyfile

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/html

  # 5. Auto-Publish Docs to GitHub Pages (only on main push)
  deploy-docs:
    name: Deploy Docs to GitHub Pages
    needs: build-docs
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4